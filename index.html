<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Assignment</title>
</head>
<body>

    <h2>JavaScript Assignment - 8 Questions</h2>
   

    <script>
        // Question 1: First and Last Name
        let firstName = "Abdullah";
        let lastName = "Khan";

        console.log("Question 1: First and Last Name");
        console.log("Full Name: " + firstName + " " + lastName);


        // Question 2: Arithmetic Operations
        let num1 = 10;
        let num2 = 20;
        let num3 = 30;

        console.log("Question 2: Arithmetic Operations");
        console.log("Addition: " + (num1 + num2 + num3));
        console.log("Subtraction: " + (num1 - num2 - num3));
        console.log("Multiplication: " + (num1 * num2 * num3));
        console.log("Division: " + (num1 / num2 / num3));


        // Question 3: Temperature Checker
        let temp = Number(prompt("Q3: Enter temperature in Celsius:"));

        console.log("Question 3: Temperature Checker");

        if (temp <= 0) {
            console.log("Freezing");
        } else {
            console.log("Not freezing");
        }


        // Question 4: Age Category
        let age = Number(prompt("Q4: Enter your age:"));

        console.log("Question 4: Age Category");

        if (age < 0) {
            console.log("Invalid Age");
        } else if (age <= 12) {
            console.log("Child");
        } else if (age <= 19) {
            console.log("Teenager");
        } else if (age <= 59) {
            console.log("Adult");
        } else {
            console.log("Senior Citizen");
        }


        // Question 5: Electricity Bill Calculator
        let units = Number(prompt("Q5: Enter electricity units:"));
        let bill = 0;

        console.log("Question 5: Electricity Bill Calculator");

        if (units < 0) {
            console.log("Invalid electricity units");
        } else if (units <= 100) {
            bill = units * 10;
            console.log("Total Bill: Rs. " + bill);
        } else if (units <= 200) {
            bill = (100 * 10) + ((units - 100) * 15);
            console.log("Total Bill: Rs. " + bill);
        } else {
            bill = (100 * 10) + (100 * 15) + ((units - 200) * 20);
            console.log("Total Bill: Rs. " + bill);
        }


        // Question 6: Traffic Light
        let color = prompt("Q6: Enter traffic light color:")
            .trim().toLowerCase();

        console.log("Question 6: Traffic Light");

        if (color === "red") {
            console.log("Stop");
        } else if (color === "yellow") {
            console.log("Ready");
        } else if (color === "green") {
            console.log("Go");
        } else {
            console.log("Invalid Color");
        }


        // Question 7: Pocket Money Checker
        let pocketMoney = Number(prompt("Q7: Enter pocket money:"));

        console.log("Question 7: Pocket Money Checker");

        if (pocketMoney > 500) {
            console.log("You can buy a gift");
        } else {
            console.log("Save your money");
        }


        // Question 8: Free Delivery Checker
        let shoppingAmount = Number(prompt("Q8: Enter total shopping amount:"));

        console.log("Question 8: Free Delivery Checker");

        if (shoppingAmount >= 2000) {
            console.log("Free Delivery");
        } else {
            console.log("Delivery Charges Apply");
        }
    </script>

</body>
</html>
